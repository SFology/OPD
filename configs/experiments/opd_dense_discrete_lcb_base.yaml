extends: opd_completion_first_4gpu.yaml

experiment:
  name: opd_dense_discrete_lcb_base
  description: Controlled OPD/LCB-OPD comparison with exact sampled-action scoring in dense discrete neighborhoods.
  tags: [opd, lcb-opd, dense-discrete, controlled-comparison, exact-action, rtx6000-ada, auto-gpu]

# 0.35 was marginal for vLLM's non-KV initialization footprint and produced
# zero available KV-cache blocks on an otherwise empty RTX 6000 Ada. 0.45
# leaves a usable cache budget while remaining below the tested 0.55 baseline.
rollout:
  gpu_memory_utilization: 0.45

# Both arms compute the same exact-action LCB diagnostics. Child configs change
# only apply_to_training, so the comparison has matched measurement overhead.
distillation:
  robust_opd:
    enabled: true
    apply_to_training: false
    method: dense_discrete
    aggregation: lcb_gate
    action_evaluation: sampled_token_exact

    # r_LCB = sign(r_OPD) * [|r_OPD| - lambda * neighborhood_risk]_+.
    # Softmax risk is a smooth worst-case approximation over selected states.
    risk_aggregation: softmax
    risk_temperature: 1.0
    lcb_lambda: 1.0
    lcb_epsilon: 1.0e-6

    # Student and teacher neighborhoods are defined independently using their
    # own input embedding tables; no shared embedding space is assumed.
    representation: token_embedding_tail_mean
    tail_tokens: 16
    projection_method: count_sketch
    projection_dim: 32
    projection_seed: 314159
    embedding_cache_dir: "${OPD_STORAGE_ROOT}/cache/robust_opd_embeddings"

    # Inspect states from other rollouts of the same prompt near the same
    # normalized trajectory progress.
    candidate_stride: 8
    candidate_offsets: 6
    progress_window: 0.06
    radius_quantile: 0.25
    max_teacher_cosine_distance: 0.35
    max_student_cosine_distance: 0.35
    neighbor_k: 3
    minimum_neighbors: 1

    # Fail explicitly instead of silently dropping exact-action requests if a
    # pathological batch sends too many unique actions to one target state.
    max_request_slots: 128
    anchor_chunk_size: 256
    sample_records_per_step: 128

logging:
  dump_rollouts: false
