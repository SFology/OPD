schema_version: 1

experiment:
  name: opd_ropd_seed42_extended_evaluation
  output_root: "${OPD_STORAGE_ROOT}/evaluations"
  description: >-
    Extended 1,590-prompt, 31,744-token evaluation for stronger evidence across
    competition math, MATH-500, Minerva, and OlympiadBench.

models:
  - name: initial_student
    type: huggingface
    path: "${OPD_MODEL_DIR}/DeepSeek-R1-Distill-Qwen-1.5B"
  - name: teacher_justrl
    type: huggingface
    path: "${OPD_MODEL_DIR}/JustRL-DeepSeek-1.5B"
  - name: opd_step279
    type: fsdp_checkpoint
    source_run: >-
      ${OPD_STORAGE_ROOT}/experiments/20260906_045836_opd_dense_discrete_lcb_opd_seed42_c200eae
    path: >-
      ${OPD_STORAGE_ROOT}/experiments/20260906_045836_opd_dense_discrete_lcb_opd_seed42_c200eae/checkpoints/global_step_279/actor
  - name: ropd_step279
    type: fsdp_checkpoint
    source_run: >-
      ${OPD_STORAGE_ROOT}/experiments/20260907_164248_opd_dense_discrete_lcb_treatment_seed42_693bda4
    path: >-
      ${OPD_STORAGE_ROOT}/experiments/20260907_164248_opd_dense_discrete_lcb_treatment_seed42_693bda4/checkpoints/global_step_279/actor

datasets:
  - name: AIME24
    path: "${OPD_ROOT}/datasets/test_data/AIME24/test.parquet"
  - name: AIME25
    path: "${OPD_ROOT}/datasets/test_data/AIME25/test.parquet"
  - name: AMC23
    path: "${OPD_ROOT}/datasets/test_data/AMC23/test.parquet"
  - name: MATH-500
    path: "${OPD_STORAGE_ROOT}/datasets/extended_math_eval/MATH-500/test.parquet"
  - name: Minerva
    path: "${OPD_STORAGE_ROOT}/datasets/extended_math_eval/Minerva/test.parquet"
  - name: Olympiad-Bench
    path: "${OPD_STORAGE_ROOT}/datasets/extended_math_eval/Olympiad-Bench/test.parquet"

contamination_audit:
  report: "${OPD_STORAGE_ROOT}/datasets/extended_math_eval/contamination_audit.yaml"
  max_exact_train_overlap_unique_prompts: 0

generation:
  # Four rollouts prioritize independent-question coverage. The separate
  # paper-aligned 143-prompt evaluation retains 16 rollouts per question.
  rollouts_per_prompt: 4
  # Two OlympiadBench prompts exceed 1,024 tokens; retaining them avoids a
  # result-dependent exclusion while all prompts remain below 2,048.
  max_prompt_tokens: 2048
  max_new_tokens: 31744
  max_model_len: 33792
  temperature: 0.7
  top_p: 0.95
  repetition_penalty: 1.0
  seed_base: 430000
  dtype: bfloat16
  gpu_memory_utilization: 0.85
  max_num_seqs: 32
  enable_prefix_caching: true

analysis:
  # Symbolic/physics suites use the slower math_verify fallback. Multiprocessing
  # avoids repeating the earlier single-core grading bottleneck.
  grader_fast: false
  grader_workers: 16
  primary_comparison: [ropd_step279, opd_step279]
  pass_k: [1, 4]
  comparisons:
    - [teacher_justrl, initial_student]
    - [opd_step279, initial_student]
    - [ropd_step279, initial_student]
    - [ropd_step279, opd_step279]
  plot_comparisons:
    - [opd_step279, initial_student]
    - [ropd_step279, initial_student]
    - [ropd_step279, opd_step279]
  gap_recovery:
    student: initial_student
    teacher: teacher_justrl
    trained_models: [opd_step279, ropd_step279]
  bootstrap_samples: 10000
  confidence_level: 0.95
  bootstrap_seed: 434343

parallel:
  min_free_mb: 42000
  max_utilization: 10
  gpu_stability_seconds: 15
  gpu_poll_seconds: 60
  gpu_wait_seconds: 604800
  max_gpus: null
  retries: 3
