schema_version: 1

experiment:
  name: trustworthy_opd_confirmatory_24k_medium
  seed: 42
  output_root: "${OPD_STORAGE_ROOT}/trustworthy_opd"

data:
  parquet: "${OPD_ROOT}/datasets/dapo-math-17k.parquet"
  num_prompts: 48
  prompt_offset: 0
  rollouts_per_prompt: 4
  max_prompt_tokens: 1024
  max_new_tokens: 24576
  temperature: 1.0
  top_p: 1.0
  state_fractions: [0.2, 0.4, 0.6, 0.8]
  min_generated_tokens: 16

models:
  student: "${OPD_MODEL_DIR}/DeepSeek-R1-Distill-Qwen-1.5B"
  teacher: "${OPD_MODEL_DIR}/JustRL-DeepSeek-1.5B"
  dtype: bfloat16
  device: cuda:0
  attention_implementation: sdpa
  feature_batch_size: 2
  top_k_distribution: 32
  store_full_log_probs: true
  prefix_ppl_roles: [teacher]

representations:
  normalize: true
  definitions:
    - {name: mid_last, layers: [0.50], pooling: last_token}
    - {name: mid_tail_mean_8, layers: [0.50], pooling: tail_mean, tail_tokens: 8}
    - {name: mid_prefix_mean, layers: [0.50], pooling: prefix_mean}
    - {name: late_last, layers: [0.75], pooling: last_token}
    - {name: final_last, layers: [-1], pooling: last_token}
    - {name: last4_last, layers: [-1, -2, -3, -4], pooling: last_token}
    - {name: embedding_tail_mean_8, layers: [embedding], pooling: tail_mean, tail_tokens: 8}
    - {name: embedding_prefix_mean, layers: [embedding], pooling: prefix_mean}

neighborhood:
  methods: [dual_knn, dual_radius]
  cross_rollout_only: true
  max_position_delta: null
  knn_k_per_model: 8
  min_neighbors: 2
  radius_quantile: 0.25

stability:
  top_tail_count: 3
  cvar_quantile: 0.8

validation:
  primary_representation: mid_tail_mean_8
  primary_neighborhood: dual_knn
  selection_strategy: prompt_balanced_random
  primary_metric: relative_max
  num_anchor_states: 48
  # Six independent teacher samples estimate consistency/semantic entropy;
  # the other six teacher samples and six student samples estimate task labels.
  continuations_per_state: 12
  metric_continuations_per_state: 6
  max_new_tokens: 24576
  temperature: 0.7
  top_p: 0.95

collection_quality:
  max_truncated_fraction: 0.15
  min_parseable_fraction: 0.80

analysis:
  calibration_bins: 5
  unreliable_teacher_threshold: 0.25
  nonpositive_teacher_advantage_threshold: 0.0
