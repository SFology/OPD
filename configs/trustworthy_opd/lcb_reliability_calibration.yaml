schema_version: 1

experiment:
  name: lcb_reliability_discovery
  seed: 20260915
  output_root: "${OPD_STORAGE_ROOT}/trustworthy_opd_lcb_calibration"

source:
  run_dir: "${OPD_STORAGE_ROOT}/trustworthy_opd_four_group/20260818_120013_trustworthy_opd_four_group_ppl_stability"
  completed_rounds: 1
  labels: "ppl_decode_control/fresh_pair_labels.jsonl"
  frozen_manifest: "artifacts/frozen_rounds.json"

models:
  student: "${OPD_MODEL_DIR}/DeepSeek-R1-Distill-Qwen-1.5B"
  teacher: "${OPD_MODEL_DIR}/JustRL-DeepSeek-1.5B"
  dtype: bfloat16
  device: cuda:0
  attention_implementation: sdpa

representations:
  projection_method: count_sketch
  projection_dim: 32
  projection_seed: 314159
  embedding_cache_dir: "${OPD_STORAGE_ROOT}/cache/robust_opd_embeddings"
  definitions:
    - name: token_embedding_tail_mean
      kind: projected_token_embedding
      pooling: tail_mean
      tail_tokens: 16
    - name: mid_prefix_mean
      kind: contextual
      layers: [0.5]
      pooling: prefix_mean
    - name: mid_tail_mean_8
      kind: contextual
      layers: [0.5]
      pooling: tail_mean
      tail_tokens: 8
    - name: final_last
      kind: contextual
      layers: [-1]
      pooling: last_token

neighborhood:
  candidate_stride: 8
  candidate_offsets: 6
  progress_window: 0.06
  radius_quantile: 0.25
  max_teacher_cosine_distance: 0.35
  max_student_cosine_distance: 0.35
  neighbor_k: 3
  minimum_neighbors: 1
  variants:
    - name: online4
      rollout_block_size: 4
    - name: dense8
      rollout_block_size: null

risk:
  aggregation: softmax
  temperature: 1.0
  epsilon: 1.0e-6
  lambdas: [0.0, 0.003, 0.01, 0.03, 1.0]

analysis:
  primary_neighborhood: online4
  primary_representation: token_embedding_tail_mean
  primary_groups: [teacher_correct_student_wrong, both_wrong]
  bootstrap_samples: 2000
  confidence_level: 0.95
  prompt_folds: 5
  calibration_bins: 5
  audit_pairs_per_q: 12

parallel:
  logical_shards: 64
  min_free_mb: 30000
  max_utilization: 15
  gpu_stability_seconds: 10
  gpu_poll_seconds: 60
  gpu_wait_seconds: 86400
  max_gpus: 8
