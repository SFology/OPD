schema_version: 1

experiment:
  name: objective_reliability_repeated_teacher
  seed: 20260916
  output_root: "${OPD_STORAGE_ROOT}/trustworthy_opd_objective_reliability"

source:
  lcb_run: "${OPD_STORAGE_ROOT}/trustworthy_opd_lcb_calibration/20260915_110808_lcb_reliability_discovery"
  decode_run: "${OPD_STORAGE_ROOT}/trustworthy_opd_four_group/20260818_120013_trustworthy_opd_four_group_ppl_stability/ppl_decode_control"

models:
  student: "${OPD_MODEL_DIR}/DeepSeek-R1-Distill-Qwen-1.5B"
  teacher: "${OPD_MODEL_DIR}/JustRL-DeepSeek-1.5B"
  dtype: bfloat16
  device: cuda:0
  attention_implementation: sdpa

selection:
  student_correct: false
  require_existing_teacher_eligible: true
  target_valid_teacher_repeats: 8
  reuse_existing_repeat: true
  maximum_new_attempts_per_state: 12

generation:
  max_new_tokens: 31744
  temperature: 1.0
  top_p: 1.0

support:
  arms: [selected, random, far]
  neighborhoods: [online4, dense8]
  representations:
    - token_embedding_tail_mean
    - mid_prefix_mean
    - mid_tail_mean_8
    - final_last
  match_selected_neighbor_count: true

risk:
  aggregation: softmax
  temperature: 1.0
  epsilon: 1.0e-6
  lambdas: [0.003, 0.01, 0.03]

analysis:
  primary_arm: selected
  primary_neighborhood: online4
  primary_representation: final_last
  primary_metric: lcb_risk
  q_points: [q20, q40, q60, q80]
  prompt_folds: 5
  bootstrap_samples: 2000
  confidence_level: 0.95
  logistic_l2: 1.0e-4

parallel:
  logical_shards: 64
  min_free_mb: 30000
  max_utilization: 15
  gpu_stability_seconds: 10
  gpu_poll_seconds: 60
  gpu_wait_seconds: 86400
  max_gpus: 8

