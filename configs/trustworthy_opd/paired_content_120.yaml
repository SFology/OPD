schema_version: 1
experiment:
  name: trustworthy_opd_paired_content_120
  seed: 42
  output_root: "${OPD_STORAGE_ROOT}/trustworthy_opd"

data:
  parquet: "${OPD_ROOT}/datasets/dapo-math-17k.parquet"
  num_prompts: 120
  prompt_offset: 48
  rollouts_per_prompt: 4
  max_prompt_tokens: 1024
  max_new_tokens: 24576
  temperature: 1.0
  top_p: 1.0
  state_fractions: [0.25, 0.5, 0.75]
  min_generated_tokens: 16
  states_from_eligible_trajectories: true

models:
  student: "${OPD_MODEL_DIR}/DeepSeek-R1-Distill-Qwen-1.5B"
  teacher: "${OPD_MODEL_DIR}/JustRL-DeepSeek-1.5B"
  dtype: bfloat16
  device: cuda:0
  attention_implementation: sdpa
  feature_batch_size: 2
  top_k_distribution: 32
  store_full_log_probs: true
  prefix_ppl_roles: [teacher]

representations:
  normalize: true
  definitions:
    - name: mid_prefix_mean
      layers: [0.5]
      pooling: prefix_mean
    - name: mid_tail_mean_8
      layers: [0.5]
      pooling: tail_mean
      tail_tokens: 8
    - name: final_last
      layers: [-1]
      pooling: last_token

neighborhood:
  methods: [dual_knn]
  cross_rollout_only: true
  max_position_delta: null
  max_normalized_position_delta: 0.03
  knn_k_per_model: 3
  min_neighbors: 2
  radius_quantile: 0.25

stability:
  top_tail_count: 3
  cvar_quantile: 0.8

# These fields keep the shared pipeline schema complete; the standard
# continuation validator is not used by the paired-content runner.
validation:
  primary_representation: mid_prefix_mean
  primary_neighborhood: dual_knn
  selection_strategy: prompt_balanced_random
  primary_metric: relative_max
  num_anchor_states: 120
  continuations_per_state: 8
  metric_continuations_per_state: 4
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.95

collection_quality:
  max_truncated_fraction: 0.01
  # Parsing is an engineering eligibility filter, not an analysis target.
  min_parseable_fraction: null
  min_valid_rollouts_per_prompt: 3

analysis:
  calibration_bins: 5
  unreliable_teacher_threshold: 0.25
  nonpositive_teacher_advantage_threshold: 0.0

paired_content:
  anchor_fractions: [0.25, 0.5, 0.75]
  teacher_metric_valid_samples: 4
  task_label_valid_samples_per_condition: 4
  max_generation_attempts_per_condition: 24
  attempt_batch_size: 4
  max_new_tokens: 16384
  temperature: 0.7
  top_p: 0.95
  minimum_complete_state_fraction: 0.9
  bootstrap_samples: 2000
